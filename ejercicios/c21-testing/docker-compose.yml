services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/.env:/app/.env
    depends_on:
      - api

  api:
    build: ./backend
    ports: ["3000:3000", "5555:5555"]                     # ← 5555 = Studio
    env_file: [backend/.env]
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma                      # ← NUEVO
      - ./backend/prisma.config.ts:/app/prisma.config.ts  # ← NUEVO
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    env_file: [backend/.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

volumes:
  pgdata: