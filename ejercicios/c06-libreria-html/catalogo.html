<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de libros de Lectura Inteligente. Buscá por título y encontrá tu próxima lectura favorita.">
    <title>Catálogo de Libros — Lectura Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg border-bottom navbar-custom" data-bs-theme="light">
            <div class="container-fluid">
                <a class="navbar-brand display-6" href="index.html">
                    <img src="imagenes/pila-de-libros-de-tres.png" alt="Logo Lectura Inteligente" width="30" height="30" class="d-inline-block align-text-top">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container text-center" style="margin-top: 2rem; margin-bottom: 3rem;">

            <div class="row mb-3">
                <div class="col text-start">
                    <a href="index.html" class="btn btn-secondary btn-sm">
                        &larr; Volver al inicio
                    </a>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col">
                    <h1 class="display-5">Catálogo de Libros</h1>
                    <p class="lead">Buscá tu próximo libro favorito</p>
                </div>
            </div>

            <div class="row justify-content-center mb-5">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm" style="background-color: #ffffff; border: 1px solid var(--color-acento, #0984e3);">
                        <div class="card-body">
                            <div class="input-group">
                                <input type="text" id="inputBusqueda" class="form-control" placeholder="Escribir título del libro...">
                                <button class="btn btn-buscar" id="btnBuscar" type="button">Buscar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <p id="mensajeCarga" class="text-secondary fw-bold"></p>
                    <div id="errores"></div>
                </div>
            </div>

            <div class="row g-4" id="divResultados">
                <div class="col-12 text-muted mt-5">
                    <p><i>Los resultados de la búsqueda aparecerán aquí...</i></p>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-3 mt-5 border-top">
        <p class="text-muted mb-0">© 2026 Lectura Inteligente. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
