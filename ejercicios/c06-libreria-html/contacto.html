<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactanos para consultas, reclamos o sugerencias sobre Lectura Inteligente.">
    <title>Contacto — Lectura Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg border-bottom navbar-custom" data-bs-theme="light">
            <div class="container-fluid">
                <a class="navbar-brand display-6" href="index.html">
                    <img src="imagenes/pila-de-libros-de-tres.png" alt="Logo Lectura Inteligente" width="30" height="30" class="d-inline-block align-text-top">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container formulario-contacto">
            <form>
                <div class="mb-3">
                    <label for="inputNombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="inputNombre" required aria-required="true">
                </div>
                <div class="mb-3">
                    <label for="inputEmail" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="inputEmail" placeholder="tuEmail@dominio.com" required aria-required="true">
                </div>
                <div class="mb-3">
                    <label for="inputAsunto" class="form-label">Asunto</label>
                    <select class="form-select" id="inputAsunto" aria-label="Seleccione el asunto" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="1">Consulta</option>
                        <option value="2">Reclamo</option>
                        <option value="3">Sugerencia</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="inputMensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="inputMensaje" rows="3" required aria-required="true"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </main>

    <footer class="text-center py-3 mt-5 border-top">
        <p class="text-muted mb-0">© 2026 Lectura Inteligente. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
